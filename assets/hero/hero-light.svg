<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" viewBox="0 0 900 280" fill="none">
  <defs>
    <!-- Light Background Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Subtle Aura Pool -->
    <radialGradient id="auraLight" cx="72%" cy="48%" r="45%" fx="72%" fy="48%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#0284C7" fill-opacity="0.3"/>
    </pattern>

    <linearGradient id="titleInk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="280" rx="14" fill="url(#bgLight)"/>
  <rect width="900" height="280" rx="14" fill="url(#gridLight)"/>
  <rect width="900" height="280" rx="14" fill="url(#auraLight)"/>

  <!-- Outer Double-Bezel Border -->
  <rect x="1" y="1" width="898" height="278" rx="13" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="7" y="7" width="886" height="266" rx="10" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Telemetry Header -->
  <g transform="translate(36, 36)">
    <!-- Live Status Pill -->
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#F1F5F9" stroke="#0284C7" stroke-opacity="0.4"/>
    <circle cx="12" cy="12" r="4" fill="#0284C7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" fill="#0369A1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.2">SYSTEM // PROD_AGENTIC</text>

    <!-- Version & Status -->
    <text x="210" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" letter-spacing="1">STATE: PERSISTENT  |  DAG: ACTIVE  |  BOUNDED_MCP</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(36, 102)">
    <text x="0" y="0" fill="url(#titleInk)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">YASH SRIVASTAVA</text>
  </g>

  <!-- Subtitle / Positioning -->
  <g transform="translate(36, 134)">
    <text x="0" y="0" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.2">Founding AI Engineer</text>
    <text x="160" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">·</text>
    <text x="174" y="0" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Autonomous Agentic Systems &amp; Distributed Backends</text>
  </g>

  <!-- Thesis / Philosophy line -->
  <g transform="translate(36, 166)">
    <text x="0" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Engineering beyond prompt completion — persistent DAG workflows, bounded recovery, and high-throughput AI gateways.
    </text>
  </g>

  <!-- Bottom Badges / Tech Matrix Indicators -->
  <g transform="translate(36, 218)">
    <rect x="0" y="0" width="138" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="10" y="16" fill="#1E293B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">⚡ Python / FastAPI</text>

    <rect x="146" y="0" width="154" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="156" y="16" fill="#1E293B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">🛡️ Bounded MCP Tools</text>

    <rect x="308" y="0" width="144" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="318" y="16" fill="#1E293B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">🔄 State &amp; Resiliency</text>
  </g>

  <!-- Right Visual Area: Ultra Instinct Core -->
  <g transform="translate(680, 140)">
    <circle cx="0" cy="0" r="85" stroke="#0284C7" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 8" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="105" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="4 6" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <polygon points="0,-48 38,0 0,48 -38,0" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6"/>
    <polygon points="0,-28 22,0 0,28 -22,0" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>

    <text x="0" y="6" text-anchor="middle" fill="#0F172A" font-family="'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif" font-size="14" font-weight="800" letter-spacing="3">身勝手</text>
    
    <line x1="-60" y1="0" x2="-45" y2="0" stroke="#0284C7" stroke-width="1"/>
    <line x1="45" y1="0" x2="60" y2="0" stroke="#0284C7" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="-45" stroke="#0284C7" stroke-width="1"/>
    <line x1="0" y1="45" x2="0" y2="60" stroke="#0284C7" stroke-width="1"/>

    <text x="0" y="78" text-anchor="middle" fill="#0369A1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2">MIGATTE // CORE</text>
    <text x="0" y="94" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" letter-spacing="1">CALM UNDER PEAK LOAD</text>
  </g>
</svg>
