<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="135" viewBox="0 0 900 135" fill="none">
  <defs>
    <linearGradient id="mfDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="135" fill="url(#mfDarkBg)"/>
  <rect x="0.5" y="0.5" width="899" height="134" stroke="#26262B" stroke-width="1"/>

  <!-- Top Title / Registration -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" fill="#EAE8E4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">03 // MEDIFINDX  —  MULTIMODAL GROUNDING PIPELINE</text>
  </g>

  <!-- Stage 1: Multimodal Inputs (Width 160) -->
  <g transform="translate(24, 38)">
    <rect width="160" height="78" fill="#18181C" stroke="#2A2A32" stroke-width="1"/>
    <text x="12" y="18" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">INPUT MODES</text>
    <line x1="12" y1="24" x2="148" y2="24" stroke="#2A2A32" stroke-width="1"/>
    <text x="12" y="40" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10.5">• Text Query</text>
    <text x="12" y="55" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="10.5">• Medicine Photo</text>
    <text x="12" y="70" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10.5">• Voice Audio</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(196, 77)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#52525B" stroke-width="1.5"/>
    <polygon points="16,-3 22,0 16,3" fill="#52525B"/>
  </g>

  <!-- Stage 2: Identify / Entity Resolution (Width 160) -->
  <g transform="translate(228, 38)">
    <rect width="160" height="78" fill="#18181C" stroke="#2A2A32" stroke-width="1"/>
    <text x="12" y="18" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">PARSE &amp; IDENTIFY</text>
    <line x1="12" y1="24" x2="148" y2="24" stroke="#2A2A32" stroke-width="1"/>
    <text x="12" y="44" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10.5">Entity Extraction</text>
    <text x="12" y="60" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9.5">LangGraph routing</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(400, 77)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#52525B" stroke-width="1.5"/>
    <polygon points="16,-3 22,0 16,3" fill="#52525B"/>
  </g>

  <!-- Stage 3: Grounded Public Sources (Width 220) -->
  <g transform="translate(432, 38)">
    <rect width="220" height="78" fill="#18181C" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">GROUNDED PUBLIC SOURCES</text>
    <line x1="14" y1="24" x2="206" y2="24" stroke="#2A2A32" stroke-width="1"/>
    <text x="14" y="42" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10">• RxNorm (Active Ingredients)</text>
    <text x="14" y="57" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10">• openFDA (Public Guidance)</text>
    <text x="14" y="72" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10">• Wikipedia (Context Reference)</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(664, 77)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#52525B" stroke-width="1.5"/>
    <polygon points="16,-3 22,0 16,3" fill="#52525B"/>
  </g>

  <!-- Stage 4: Structured Educational Report (Width 180) -->
  <g transform="translate(696, 38)">
    <rect width="180" height="78" fill="#18181C" stroke="#2A2A32" stroke-width="1"/>
    <text x="14" y="18" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">OUTPUT SUMMARY</text>
    <line x1="14" y1="24" x2="166" y2="24" stroke="#2A2A32" stroke-width="1"/>
    <text x="14" y="44" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10.5">Structured Educational</text>
    <text x="14" y="58" fill="#EAE8E4" font-family="-apple-system, sans-serif" font-size="10.5">Health Report</text>
    <text x="14" y="71" fill="#71717A" font-family="-apple-system, sans-serif" font-size="8.5">Public HF Space</text>
  </g>
</svg>
