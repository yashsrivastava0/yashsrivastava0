      <rect x="142" y="0" width="94" height="18" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="150" y="13" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="9.5">PostgreSQL</text>

      <rect x="244" y="0" width="102" height="18" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <text x="252" y="13" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="9.5">Docker CI/CD</text>

