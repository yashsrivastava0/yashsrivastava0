    </text>
    <text x="0" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      Converts fragmented intent into validated, multi-stage software artifacts via persistent DAG workers, human-approval boundaries, and sandboxed preview environments.
    </text>

