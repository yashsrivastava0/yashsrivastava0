<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="136" viewBox="0 0 900 136" fill="none">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="accentOryxen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="136" rx="12" fill="url(#projBg)"/>
  <rect x="1" y="1" width="898" height="134" rx="11" stroke="#1E293B" stroke-width="1"/>
  <rect x="5" y="5" width="890" height="126" rx="9" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Left Icon & Type -->
  <g transform="translate(24, 24)">
    <!-- Flagship Pill -->
    <rect x="0" y="0" width="100" height="20" rx="4" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="8" y="14" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700">★ FLAGSHIP_01</text>

    <!-- Title -->
    <text x="114" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">OryxenAI</text>
    <text x="218" y="16" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">v1.2 // Production Ready</text>

    <!-- Description -->
    <text x="0" y="44" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
