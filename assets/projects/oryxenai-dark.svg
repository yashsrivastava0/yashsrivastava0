      <text x="8" y="13" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5">Python</text>
      
      <rect x="68" y="0" width="66" height="18" rx="4" fill="#1E293B"/>
      <text x="76" y="13" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5">FastAPI</text>

      <rect x="142" y="0" width="94" height="18" rx="4" fill="#1E293B"/>
      <text x="150" y="13" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5">PostgreSQL</text>

      <rect x="244" y="0" width="102" height="18" rx="4" fill="#1E293B"/>
      <text x="252" y="13" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9.5">Docker CI/CD</text>

      <rect x="354" y="0" width="138" height="18" rx="4" fill="#1E293B"/>
