<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="16" viewBox="0 0 900 16" fill="none">
  <defs>
    <linearGradient id="silverStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#E2E8F0" stop-opacity="0.8">
        <animate attributeName="offset" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1">
        <animate attributeName="stop-color" values="#38BDF8;#CBD5E1;#0284C7;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#94A3B8" stop-opacity="0.8">
        <animate attributeName="offset" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle hairline -->
  <line x1="20" y1="8" x2="880" y2="8" stroke="#334155" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4" />
  <!-- Glowing Animated Aura Beam -->
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#silverStream)" stroke-width="2.5" stroke-linecap="round" filter="url(#auraGlow)" />
  <!-- Center Energy Core Accent Diamond -->
  <g transform="translate(450, 8)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#E2E8F0">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </polygon>
  </g>
</svg>
