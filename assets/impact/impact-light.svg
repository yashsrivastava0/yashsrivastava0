    <text x="20" y="66" fill="#0F172A" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">TOKEN OVERHEAD</text>
    <text x="20" y="88" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Reduced context from 95K → 63.4K tokens</text>
    <text x="20" y="104" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">while strictly preserving validation schemas.</text>
